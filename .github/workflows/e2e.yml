name: Playwright E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      BASE_URL: ${{ vars.BASE_URL || 'https://automationexercise.com' }}
      # The target is a shared public service; serial CI traffic prevents queue-full responses.
      WORKERS: ${{ vars.WORKERS || '1' }}
      TEST_DATA_FILE: ${{ vars.TEST_DATA_FILE || 'config/test-data.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
        id: typecheck
      - name: Check ad helpers
        run: npm run test:helpers
      - name: Run live E2E journeys
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' }}
        run: npm test
      - name: Publish HTML report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
